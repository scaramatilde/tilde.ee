<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La mia galleria</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f1ea;
            color: #222;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background-color: #222;
            color: white;
        }

        header h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        header p {
            font-size: 18px;
        }

        .galleria {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .quadro {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .quadro img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .info {
            padding: 18px;
        }

        .info h2 {
            margin: 0 0 8px;
        }

        .info p {
            margin: 0;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>La mia galleria</h1>
        <p>Una collezione di quadri</p>
    </header>

    <main class="galleria">

        <div class="quadro">
            <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=800" alt="Quadro">
            <div class="info">
                <h2>Quadro 1</h2>
                <p>Descrizione del quadro</p>
            </div>
        </div>

        <div class="quadro">
            <img src="https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?w=800" alt="Quadro">
            <div class="info">
                <h2>Quadro 2</h2>
                <p>Descrizione del quadro</p>
            </div>
        </div>

        <div class="quadro">
            <img src="https://images.unsplash.com/photo-1549490349-8643362247b5?w=800" alt="Quadro">
            <div class="info">
                <h2>Quadro 3</h2>
                <p>Descrizione del quadro</p>
            </div>
        </div>

    </main>

</body>
</html>
